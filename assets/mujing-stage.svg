    <text x="125" y="362" fill="#27251F" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13">读懂人物关系</text>
    <text x="125" y="386" fill="#27251F" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13">准备每一幕的开场</text>
    <text x="125" y="410" fill="#27251F" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13">把握现场的节奏</text>
    <rect x="447" y="351" width="52" height="58" fill="none" stroke="#A94435" stroke-width="1.5"/>
    <rect x="451" y="355" width="44" height="50" fill="none" stroke="#A94435" stroke-width=".6"/>
