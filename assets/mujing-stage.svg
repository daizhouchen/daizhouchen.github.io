    <circle cx="455" cy="205" r="65" fill="#A94435" opacity=".12"/>
    <circle cx="470" cy="190" r="49" fill="none" stroke="#A94435" opacity=".25"/>
    <path d="M410 252c34-37 72-35 108-64M430 256c23-7 42-4 69 5" fill="none" stroke="#536A53" stroke-width="1.5" opacity=".8"/>
    <text x="122" y="184" fill="#27251F" font-family="Noto Serif SC, Songti SC, SimSun, serif" font-size="43">盛夏</text>
    <text x="122" y="241" fill="#27251F" font-family="Noto Serif SC, Songti SC, SimSun, serif" font-size="43">告别派对</text>
    <text x="125" y="280" fill="#69655A" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="2">有些话，要在今晚说出口。</text>
    <path d="M125 307h383" stroke="#D8D1C3"/>
