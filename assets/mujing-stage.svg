<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" role="img" aria-labelledby="title desc">
  <title id="title">幕境活动手册示意</title>
  <desc id="desc">东方剧场风格的盛夏告别派对活动手册，以选样例、备场、本机演练、复盘四个步骤呈现工作流。此为视觉示意，不是产品截图。</desc>
  <defs><pattern id="paper" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".55" fill="#27251F" opacity=".04"/></pattern></defs>
  <rect width="640" height="650" fill="#E9E2D5"/>
  <rect width="640" height="650" fill="url(#paper)"/>
  <path d="M0 0h640v45H0z" fill="#27251F"/>
  <text x="31" y="28" fill="#F7F3EB" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" letter-spacing="2">MUJING / THE HOST’S HANDBOOK</text>
  <text x="605" y="28" text-anchor="end" fill="#C5BDAE" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="10">视觉示意</text>
