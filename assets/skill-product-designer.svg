<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="阅读清单：仓库移动端线框模板填充示例">


  <!-- Adapted from daizhouchen/claude-product-designer, assets/svg/mobile-wireframe.svg. Example content, not a shipped app. -->
  <defs>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8281f"/>
    </marker>
  </defs>

  <style>
    .wf-bg { fill: #f9f5ec; }
    .wf-frame { fill: none; stroke: #b8281f; stroke-width: 1; opacity: 0.35; }

    /* 手机外壳 */
    .wf-phone-shell {
      fill: #fcfaf4;
      stroke: #1a1a1a;
      stroke-width: 1.6;
    }
    .wf-screen-bg { fill: #f5f0e8; }
    .wf-statusbar { fill: #1a1a1a; opacity: 0.85; }
    .wf-statusbar-text {
      font-family: "Crimson Pro", "Georgia", serif;
      font-size: 9px;
      fill: #f9f5ec;
      letter-spacing: 0.08em;
    }
    .wf-notch { fill: #1a1a1a; }
    .wf-home-indicator { stroke: #1a1a1a; stroke-width: 1.4; stroke-linecap: round; }
    .wf-screen-sep { stroke: #1a1a1a; stroke-width: 0.6; opacity: 0.2; }

    /* 屏内文字与元素 */
    .wf-title {
      font-family: "Kaiti SC", "KaiTi", "楷体", serif;
      font-size: 16px;
      fill: #3A2E26;
      text-anchor: middle;
      letter-spacing: 0.12em;
    }
    .wf-elem-text {
      font-family: "Songti SC", "宋体", serif;
      font-size: 11.5px;
      fill: #3A2E26;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .wf-elem-text-left {
      font-family: "Songti SC", "宋体", serif;
      font-size: 11.5px;
      fill: #3A2E26;
      dominant-baseline: central;
    }
    .wf-btn-text {
      font-family: "Songti SC", "宋体", serif;
      font-size: 12px;
      fill: #f9f5ec;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.1em;
    }
    .wf-card-fill { fill: #fcfaf4; stroke: #b89b66; stroke-width: 0.8; }
    .wf-input-fill { fill: none; stroke: #8a8a8a; stroke-width: 0.8; stroke-dasharray: 3 2; }
    .wf-btn-secondary { fill: #3A2E26; stroke: none; }
    .wf-btn-primary { fill: #b8281f; stroke: none; }
    .wf-tab-bar { fill: #fcfaf4; stroke: #1a1a1a; stroke-width: 0.6; opacity: 0.9; }
    .wf-tab-dot { fill: #b8281f; }
    .wf-tab-text {
      font-family: "Songti SC", "宋体", serif;
      font-size: 9.5px;
      fill: #3A2E26;
      text-anchor: middle;
    }
    .wf-list-dot { fill: #b89b66; }
    .wf-text-line { fill: none; stroke: #8a8a8a; stroke-width: 0.8; opacity: 0.55; }

    /* 屏底标签条 */
    .wf-label-bar {
      fill: rgba(184, 40, 31, 0.08);
      stroke: #b8281f;
      stroke-width: 0.8;
      opacity: 0.85;
    }
    .wf-label-text {
      font-family: "Kaiti SC", "KaiTi", serif;
      font-size: 13px;
      fill: #b8281f;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.15em;
    }
    .wf-screen-num {
      font-family: "Crimson Pro", "Georgia", serif;
      font-size: 10px;
      fill: #8a8a8a;
      text-anchor: middle;
      letter-spacing: 0.25em;
    }

    /* 屏间箭头 + 触发文字 */
    .wf-trigger-arrow { fill: none; stroke: #b8281f; stroke-width: 1.2; opacity: 0.85; }
    .wf-trigger-text {
      font-family: "Kaiti SC", "KaiTi", serif;
      font-size: 12px;
      fill: #b8281f;
      text-anchor: middle;
      letter-spacing: 0.08em;
      font-style: italic;
    }

    /* 顶部章节标题 */
    .wf-section-title {
      font-family: "Kaiti SC", "KaiTi", serif;
      font-size: 18px;
      fill: #3A2E26;
      letter-spacing: 0.25em;
    }
    .wf-section-sub {
      font-family: "Crimson Pro", "Georgia", serif;
      font-size: 10.5px;
      fill: #8a8a8a;
      letter-spacing: 0.28em;
    }
  </style>

  <rect class="wf-bg" x="0" y="0" width="1200" height="800"/>
  <rect class="wf-frame" x="20" y="20" width="1160" height="760"/>


  <text class="wf-section-title" x="40" y="58">阅 读 清 单 · 模 板 示 例</text>
  <text class="wf-section-sub" x="40" y="76">PRODUCT DESIGNER  /  TEMPLATE EXAMPLE</text>
  <line class="wf-screen-sep" x1="40" y1="88" x2="1160" y2="88"/>


  <g class="screen-1">

    <rect class="wf-phone-shell" x="120" y="120" width="240" height="500" rx="28"/>

    <rect class="wf-screen-bg" x="130" y="130" width="220" height="480" rx="20"/>

    <rect class="wf-statusbar" x="130" y="130" width="220" height="20" rx="20"/>
    <rect class="wf-statusbar" x="130" y="140" width="220" height="10"/>
    <text class="wf-statusbar-text" x="148" y="144">09:41</text>
    <text class="wf-statusbar-text" x="332" y="144" text-anchor="end">100%</text>

    <rect class="wf-notch" x="208" y="130" width="64" height="14" rx="7"/>


    <text class="wf-title" x="240" y="180">我的阅读</text>


    <rect class="wf-input-fill" x="148" y="206" width="184" height="32" rx="16"/>
    <circle cx="164" cy="222" r="4" fill="none" stroke="#8a8a8a" stroke-width="0.8"/>
    <line x1="167" y1="225" x2="171" y2="229" stroke="#8a8a8a" stroke-width="0.8"/>
    <text class="wf-elem-text" x="240" y="222">搜索书名</text>


    <rect class="wf-card-fill" x="148" y="254" width="184" height="64" rx="6"/>
    <rect x="160" y="266" width="40" height="40" rx="4" fill="#b89b66" opacity="0.18" stroke="#b89b66" stroke-width="0.6"/>
    <text class="wf-elem-text-left" x="210" y="282">设计中的设计</text>
    <line class="wf-text-line" x1="210" y1="292" x2="320" y2="292"/>
    <line class="wf-text-line" x1="210" y1="300" x2="290" y2="300"/>


    <line class="wf-screen-sep" x1="148" y1="338" x2="332" y2="338"/>
    <circle class="wf-list-dot" cx="158" cy="354" r="2.5"/>
    <text class="wf-elem-text-left" x="170" y="354">正在阅读</text>
    <line class="wf-screen-sep" x1="148" y1="370" x2="332" y2="370"/>
    <circle class="wf-list-dot" cx="158" cy="386" r="2.5"/>
    <text class="wf-elem-text-left" x="170" y="386">想读清单</text>
    <line class="wf-screen-sep" x1="148" y1="402" x2="332" y2="402"/>


    <rect class="wf-tab-bar" x="130" y="554" width="220" height="46" rx="0"/>
    <circle class="wf-tab-dot" cx="170" cy="572" r="4"/>
    <text class="wf-tab-text" x="170" y="590">书架</text>
    <circle cx="240" cy="572" r="3.5" fill="none" stroke="#8a8a8a" stroke-width="0.8"/>
    <text class="wf-tab-text" x="240" y="590" fill="#8a8a8a">·</text>
    <circle cx="310" cy="572" r="3.5" fill="none" stroke="#8a8a8a" stroke-width="0.8"/>
    <text class="wf-tab-text" x="310" y="590" fill="#8a8a8a">·</text>

    <line class="wf-home-indicator" x1="200" y1="606" x2="280" y2="606"/>


    <text class="wf-screen-num" x="240" y="652">SCREEN · 01</text>
    <rect class="wf-label-bar" x="142" y="662" width="196" height="32" rx="3"/>
    <text class="wf-label-text" x="240" y="678">发现书目</text>
  </g>


  <path class="wf-trigger-arrow" d="M 372 380 Q 420 420 468 380" marker-end="url(#wf-arrow)"/>
  <text class="wf-trigger-text" x="420" y="368">「选择书目」</text>


  <g class="screen-2">
    <rect class="wf-phone-shell" x="480" y="120" width="240" height="500" rx="28"/>
    <rect class="wf-screen-bg" x="490" y="130" width="220" height="480" rx="20"/>
    <rect class="wf-statusbar" x="490" y="130" width="220" height="20" rx="20"/>
    <rect class="wf-statusbar" x="490" y="140" width="220" height="10"/>
    <text class="wf-statusbar-text" x="508" y="144">09:41</text>
    <text class="wf-statusbar-text" x="692" y="144" text-anchor="end">100%</text>
    <rect class="wf-notch" x="568" y="130" width="64" height="14" rx="7"/>


    <text class="wf-title" x="600" y="180">阅读计划</text>


    <path d="M 510 178 L 504 184 L 510 190" fill="none" stroke="#3A2E26" stroke-width="1.2"/>


    <rect class="wf-card-fill" x="508" y="206" width="184" height="78" rx="6"/>
    <line x1="508" y1="206" x2="692" y2="284" stroke="#b89b66" stroke-width="0.5" opacity="0.3"/>
    <line x1="692" y1="206" x2="508" y2="284" stroke="#b89b66" stroke-width="0.5" opacity="0.3"/>
    <text class="wf-elem-text" x="600" y="248">书籍封面</text>


    <text class="wf-elem-text-left" x="508" y="304" style="font-size:13px;font-weight:600;">设计中的设计</text>
    <line class="wf-text-line" x1="508" y1="316" x2="692" y2="316"/>
    <line class="wf-text-line" x1="508" y1="324" x2="650" y2="324"/>
    <line class="wf-text-line" x1="508" y1="332" x2="680" y2="332"/>


    <rect class="wf-card-fill" x="508" y="348" width="88" height="40" rx="4"/>
    <text class="wf-elem-text" x="552" y="368">每天 15 分钟</text>
    <rect class="wf-card-fill" x="604" y="348" width="88" height="40" rx="4"/>
    <text class="wf-elem-text" x="648" y="368">晚间提醒</text>


    <line class="wf-screen-sep" x1="508" y1="406" x2="692" y2="406"/>
    <circle class="wf-list-dot" cx="518" cy="422" r="2.5"/>
    <text class="wf-elem-text-left" x="530" y="422">阅读笔记</text>
    <line class="wf-screen-sep" x1="508" y1="438" x2="692" y2="438"/>


    <rect class="wf-btn-primary" x="508" y="498" width="184" height="42" rx="21"/>
    <text class="wf-btn-text" x="600" y="519">加入阅读计划</text>

    <line class="wf-home-indicator" x1="560" y1="606" x2="640" y2="606"/>

    <text class="wf-screen-num" x="600" y="652">SCREEN · 02</text>
    <rect class="wf-label-bar" x="502" y="662" width="196" height="32" rx="3"/>
    <text class="wf-label-text" x="600" y="678">设置计划</text>
  </g>


  <path class="wf-trigger-arrow" d="M 732 380 Q 780 420 828 380" marker-end="url(#wf-arrow)"/>
  <text class="wf-trigger-text" x="780" y="368">「保存计划」</text>


  <g class="screen-3">
    <rect class="wf-phone-shell" x="840" y="120" width="240" height="500" rx="28"/>
    <rect class="wf-screen-bg" x="850" y="130" width="220" height="480" rx="20"/>
    <rect class="wf-statusbar" x="850" y="130" width="220" height="20" rx="20"/>
    <rect class="wf-statusbar" x="850" y="140" width="220" height="10"/>
    <text class="wf-statusbar-text" x="868" y="144">09:41</text>
    <text class="wf-statusbar-text" x="1052" y="144" text-anchor="end">100%</text>
    <rect class="wf-notch" x="928" y="130" width="64" height="14" rx="7"/>

    <text class="wf-title" x="960" y="180">已加入清单</text>


    <circle cx="960" cy="260" r="38" fill="none" stroke="#b8281f" stroke-width="1.6"/>
    <path d="M 944 260 L 956 272 L 978 250" fill="none" stroke="#b8281f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>


    <text class="wf-elem-text" x="960" y="320" style="font-size:14px;font-weight:600;">阅读计划已保存</text>


    <text class="wf-elem-text" x="960" y="342" style="fill:#8a8a8a;">从今天的一小段开始</text>


    <rect class="wf-card-fill" x="868" y="370" width="184" height="56" rx="6"/>
    <text class="wf-elem-text-left" x="880" y="390">下次阅读 · 今天</text>
    <line class="wf-text-line" x1="880" y1="402" x2="1040" y2="402"/>
    <line class="wf-text-line" x1="880" y1="412" x2="1000" y2="412"/>


    <text class="wf-elem-text" x="960" y="450" style="fill:#8a8a8a;text-decoration:underline;">调整计划</text>


    <rect class="wf-btn-secondary" x="868" y="498" width="184" height="42" rx="21"/>
    <text class="wf-btn-text" x="960" y="519">返回我的书架</text>

    <line class="wf-home-indicator" x1="920" y1="606" x2="1000" y2="606"/>

    <text class="wf-screen-num" x="960" y="652">SCREEN · 03</text>
    <rect class="wf-label-bar" x="862" y="662" width="196" height="32" rx="3"/>
    <text class="wf-label-text" x="960" y="678">完成与回看</text>
  </g>


  <text x="600" y="752" style="font-family:'Kaiti SC',serif;font-size:11px;fill:#8a8a8a;text-anchor:middle;letter-spacing:0.2em;">基于仓库线框模板填充的演示场景</text>
</svg>
